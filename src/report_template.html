<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PII Eval · 评测报告</title>
<style>
:root{color-scheme:light;--ink:#172c39;--muted:#627783;--line:#dbe6e9;--green:#087d6b;--red:#ba413a}
*{box-sizing:border-box}body{margin:0;background:#f3f6f7;color:var(--ink);font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button,a{cursor:pointer}header{background:#12333f;color:#fff;padding:28px 5vw 25px}header small{letter-spacing:.2em;color:#9acfc9}h1{font-size:27px;margin:5px 0}h2{font-size:18px;margin:0 0 15px}p{margin:8px 0}.sub{color:#b9cfd6;overflow-wrap:anywhere}main{max-width:1600px;margin:auto;padding:24px 4vw}.notice{border-left:4px solid #d1a441;background:#fff7df;padding:12px 18px;margin-bottom:22px;color:#665226}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.card,.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:20px;box-shadow:0 3px 8px #213c4504}.hero{font-size:43px;font-weight:650;letter-spacing:-.04em}.tag{font-size:12px;background:#e8f5f0;color:var(--green);border-radius:20px;padding:3px 9px;display:inline-block}.muted{color:var(--muted)}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:0 0 22px}.kpi{background:#e9f0f2;border-radius:10px;padding:13px 16px}.kpi strong{display:block;font-size:23px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:20px}.bars{display:grid;gap:10px}.bar{display:grid;grid-template-columns:150px 1fr 55px;gap:12px;align-items:center}.bar i{display:block;height:9px;background:#0a8c79;border-radius:5px}.track{background:#e9f1f2;border-radius:5px;overflow:hidden}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}input,select,button{padding:8px 10px;border:1px solid #cbdadd;border-radius:6px;background:#fff;color:var(--ink)}input[type=search]{min-width:200px}.btn{background:var(--green);color:#fff;border:0}table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}th{color:var(--muted);font-weight:500;background:#f5f8f9}td,th{padding:10px 12px;border-bottom:1px solid #e7eef0;white-space:nowrap}.table-scroll{overflow:auto}tbody tr:hover{background:#f3faf8}tbody button{border:0;background:none;color:#087b71;padding:0}.error{color:var(--red)}.pagination{display:flex;justify-content:space-between;align-items:center;margin-top:16px}dialog{width:min(1150px,96vw);max-height:92vh;border:1px solid var(--line);border-radius:14px;padding:25px;color:var(--ink)}dialog::backdrop{background:#08232a9c}.close{float:right}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f7f8;padding:13px;border-radius:8px;font:13px/1.8 Consolas,"Microsoft YaHei",monospace}mark{background:#ffd5bd;border-bottom:2px solid #d66b39;color:inherit}.gold mark{background:#c9eee4;border-color:#087d6b}.links{display:flex;gap:15px;flex-wrap:wrap}a{color:var(--green)}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.stage{border:1px solid var(--line);border-radius:7px;padding:10px;margin:7px 0}img.preview{max-width:100%;max-height:450px;object-fit:contain;border:1px solid var(--line)}footer{color:var(--muted);padding:10px 0 25px;font-size:12px}details{margin-top:14px}summary{cursor:pointer}.legend{display:flex;gap:12px;font-size:12px}.legend span{padding:2px 8px;background:#e6f1ed;border-radius:4px}@media(max-width:850px){.cards,.columns,.detail-grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.bar{grid-template-columns:100px 1fr 55px}main{padding:18px}.hero{font-size:35px}}
</style></head><body>
<header><small>PII EVALUATION / QUALITY & RISK</small><h1>脱敏模型评测报告</h1><div class="sub" id="run"></div></header>
<main><div class="notice" id="notice"></div><section class="cards" id="cards"></section><section class="kpis" id="kpis"></section>
<div class="columns"><section class="panel"><h2>实体类别 · 严格召回</h2><select id="trackMetric" aria-label="指标轨道"></select><div class="bars" id="types" style="margin-top:16px"></div></section>
<section class="panel"><h2>六阶段链路 · 平均耗时</h2><div class="bars" id="stages"></div><p class="muted">阶段耗时取真实执行记录。命中缓存保留原始耗时；文件能打开与版式保真分别核验。</p><details><summary>版本与证据</summary><pre id="meta"></pre></details></section></div>
<section class="panel"><h2>样本下钻 <span class="tag" id="total"></span></h2><div class="filters">
<input type="search" id="query" placeholder="搜索样本 ID" aria-label="搜索样本 ID"><select id="trackFilter" aria-label="筛选轨道"><option value="">全部轨道</option></select><select id="layoutFilter" aria-label="筛选版式"><option value="">全部版式</option></select><select id="typeFilter" aria-label="筛选实体"><option value="">全部实体</option></select><label><input type="checkbox" id="failed">仅错误样本</label><button id="csv">导出筛选结果 CSV</button></div>
<div class="table-scroll"><table><thead><tr><th>样本 ID</th><th>轨道 / 版式</th><th>F1</th><th>TP / FP / FN</th><th>Partial</th><th>耗时</th><th>路由</th><th>状态</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pagination"><span id="range"></span><div><button id="prev">上一页</button> <button id="next">下一页</button></div></div></section>
<footer>主口径：实体级 exact micro；日期语义裁决只作复核建议。高风险召回、误删分母、执行失败及数据覆盖独立检查。统计区间采用按版式分层的文档 bootstrap。</footer></main>
<dialog id="detail"><button class="close" id="close" aria-label="关闭详情">关闭 ✕</button><h2 id="detailTitle"></h2><div class="links" id="links"></div><p id="detailInfo" class="muted"></p><div class="detail-grid"><section><h2>金标字符区间</h2><pre class="gold" id="gold"></pre></section><section><h2>预测字符区间</h2><pre id="pred"></pre></section></div><h2>六阶段产物</h2><div id="detailStages"></div><details><summary>实体偏移与最小复现</summary><pre id="spans"></pre></details><div id="preview"></div></dialog>
<script type="application/json" id="data">__REPORT_DATA__</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),R=D.report,$=id=>document.getElementById(id);
const fmt=(n,p=3)=>n==null?'未知':Number(n).toFixed(p),pct=n=>n==null?'未知':(n*100).toFixed(2)+'%';
const node=(tag,text,cls)=>{let e=document.createElement(tag);if(text!=null)e.textContent=text;if(cls)e.className=cls;return e};
$('run').textContent=R.meta.run_tag;$('meta').textContent=JSON.stringify(R.meta,null,2);
$('notice').textContent=R.meta.synthetic_only?'合成数据 · 仅用于工程功能验收。结果不代表真实客户数据、Teacher / Student 蒸馏效果或生产发布资格。':'结果仅对当前版本、数据范围与判定规则有效，发布还需完整门禁和人工签字。';
for(const [key,title] of [['standard_text','标准文本 · 模型能力'],['complex_file','复杂文件 · 端到端效果']]){let m=R.tracks[key];if(!m)continue;let c=node('article',null,'card');c.append(node('h2',title),node('div',pct(m.f1),'hero'));let ci=R.ci[key];c.append(node('p',`${m.n.toLocaleString()} 份样本 · 95% CI [${fmt(ci.lo)}, ${fmt(ci.hi)}]`,'muted'),node('span','Exact micro F1','tag'));$('cards').append(c);let o=node('option',title);o.value=key;$('trackMetric').append(o)}
for(const [title,value] of [['高风险宏召回',pct(R.operational.high_risk_recall)],['误删率',pct(R.operational.false_delete)],['风险分',fmt(R.operational.risk_score,4)],['P95 时延',fmt(R.operational.latency_p95)+' s'],['人工复核率',pct(R.operational.review_rate)]]){let e=node('div',null,'kpi');e.append(node('div',title,'muted'),node('strong',value));$('kpis').append(e)}
function bar(container,label,value,text,scale=1){let e=node('div',null,'bar'),track=node('div',null,'track'),fill=node('i');fill.style.width=Math.max(0,Math.min(100,(value||0)*scale*100))+'%';track.append(fill);e.append(node('span',label),track,node('span',text,'muted'));container.append(e)}
function types(){$('types').replaceChildren();for(const [t,v] of Object.entries(R.tracks[$('trackMetric').value].by_type))bar($('types'),t,v.recall,pct(v.recall))}types();$('trackMetric').onchange=types;
const maxStage=Math.max(...Object.values(R.by_stage).map(v=>v.mean_elapsed_ms),1);for(const [name,v] of Object.entries(R.by_stage))bar($('stages'),name,v.mean_elapsed_ms,fmt(v.mean_elapsed_ms,1)+' ms',1/maxStage);
for(const [id,values] of [['trackFilter',[...new Set(R.rows.map(r=>r.track))]],['layoutFilter',[...new Set(R.rows.map(r=>r.layout))]],['typeFilter',[...new Set(R.rows.flatMap(r=>Object.keys(r.by_type)))]]])for(const v of values.sort()){let o=node('option',v);o.value=v;$(id).append(o)}
let page=0,filtered=[];const size=40;
function render(){filtered=R.rows.filter(r=>(!$('query').value||r.sample_id.includes($('query').value))&&(!$('trackFilter').value||r.track===$('trackFilter').value)&&(!$('layoutFilter').value||r.layout===$('layoutFilter').value)&&(!$('typeFilter').value||$('typeFilter').value in r.by_type)&&(!$('failed').checked||r.fp||r.fn||r.execution_error));if(page*size>=filtered.length)page=0;$('rows').replaceChildren();for(const r of filtered.slice(page*size,(page+1)*size)){let tr=node('tr'),td=node('td'),b=node('button',r.sample_id);b.onclick=()=>openDetail(r);td.append(b);tr.append(td);for(const v of [r.track+' / '+r.layout,pct(r.f1),`${r.tp} / ${r.fp} / ${r.fn}`,r.partial,fmt(r.latency_ms,1)+' ms',r.route,r.execution_error?'执行失败':r.fp||r.fn?'需诊断':'通过'])tr.append(node('td',v));if(r.execution_error)tr.lastChild.className='error';$('rows').append(tr)}$('total').textContent=filtered.length.toLocaleString()+' 份';$('range').textContent=filtered.length?`${page*size+1}–${Math.min((page+1)*size,filtered.length)} / ${filtered.length}`:'没有匹配样本';$('prev').disabled=page===0;$('next').disabled=(page+1)*size>=filtered.length}
for(const id of ['query','trackFilter','layoutFilter','typeFilter','failed'])$(id).oninput=()=>{page=0;render()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};render();
function highlight(container,text,spans){container.replaceChildren();let covered=new Set;for(const s of spans)for(let i=s.start;i<Math.min(s.end,text.length);i++)covered.add(i);let chars=Array.from(text),i=0;while(i<chars.length){let hit=covered.has(i),j=i+1;while(j<chars.length&&covered.has(j)===hit)j++;container.append(node(hit?'mark':'span',chars.slice(i,j).join('')));i=j}}
function link(container,title,path){if(!path)return;let a=node('a',title);a.href=path;a.target='_blank';a.rel='noopener';container.append(a)}
function openDetail(r){let s=D.samples[r.sample_id]||{text:'原文未包含于该报告'};$('detailTitle').textContent=r.sample_id;$('detailInfo').textContent=`${r.layout} · ${r.difficulty} · ${r.route_reason} · trace ${r.trace_id}`;$('links').replaceChildren();link($('links'),'打开原文件',s.source);link($('links'),'打开脱敏导出',s.export);highlight($('gold'),s.text,r.gold_spans);highlight($('pred'),s.text,r.pred_spans);$('detailStages').replaceChildren();for(const [name,v] of Object.entries(r.stages)){let e=node('div',null,'stage');e.append(node('strong',`${name} · ${v.ok?'OK':'失败'} · ${fmt(v.elapsed_ms,1)} ms`),node('div',JSON.stringify(v.metrics)));if(v.error)e.append(node('p',v.error,'error'));$('detailStages').append(e)}$('spans').textContent=JSON.stringify({gold:r.gold_spans,pred:r.pred_spans,fp:r.fp_spans,fn:r.fn_spans},null,2)+'\n\npii-eval run --sample '+r.sample_id+' --model '+R.meta.model_alias+' --no-cache';$('preview').replaceChildren();if(s.preview){let img=node('img',null,'preview');img.src=s.preview;img.alt='合成源文件预览';$('preview').append(node('h2','源文件预览'),img)}else if(s.source&&/\.png$/i.test(s.source)){let img=node('img',null,'preview');img.src=s.source;img.alt='原始扫描图片';$('preview').append(img)}$('detail').showModal()}
$('close').onclick=()=>$('detail').close();$('detail').onclick=e=>{if(e.target===$('detail'))$('detail').close()};
$('csv').onclick=()=>{let columns=['sample_id','track','layout','f1','tp','fp','fn','partial','latency_ms','route'];const quote=v=>'"'+String(v??'').replaceAll('"','""')+'"';let csv='\ufeff'+[columns,...filtered.map(r=>columns.map(k=>r[k]))].map(a=>a.map(quote).join(',')).join('\r\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=node('a');a.href=url;a.download='pii-eval-filtered.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></body></html>
